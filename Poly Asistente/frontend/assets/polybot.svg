<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" id="polybot-vector">
  <defs>
    <filter id="resplandor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="cuerpo-base">
    <g id="brazo-izq">
      <path d="M 140 260 Q 80 240 70 170" fill="transparent" stroke="#f4f4f4" stroke-width="28" stroke-linecap="round" />
      <path d="M 110 250 L 105 240" fill="transparent" stroke="#e63946" stroke-width="28" />
      <circle cx="70" cy="170" r="16" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
      <path d="M 55 160 Q 60 145 70 155" fill="transparent" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M 65 155 Q 75 140 80 155" fill="transparent" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g id="brazo-der">
      <path d="M 260 260 Q 300 280 310 330" fill="transparent" stroke="#f4f4f4" stroke-width="28" stroke-linecap="round" />
      <path d="M 285 275 L 295 282" fill="transparent" stroke="#e63946" stroke-width="28" />
      <circle cx="310" cy="330" r="14" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
    </g>

    <circle cx="200" cy="270" r="75" fill="#ffffff" stroke="#e0e0e0" stroke-width="3" />
    
    <g id="logo-pecho">
      <circle cx="200" cy="275" r="35" fill="#e63946" />
      <path d="M 180 295 L 195 290 L 195 305 Z" fill="#e63946" /> <circle cx="185" cy="275" r="4" fill="#ffffff" />
      <circle cx="200" cy="275" r="4" fill="#ffffff" />
      <circle cx="215" cy="275" r="4" fill="#ffffff" />
    </g>
  </g>

  <g id="cabeza-completa">
    <path d="M 150 75 Q 200 50 250 75 L 230 90 L 170 90 Z" fill="#e63946" />

    <rect x="90" y="80" width="220" height="140" rx="70" fill="#ffffff" stroke="#e0e0e0" stroke-width="3" />

    <g id="auriculares">
      <rect x="75" y="125" width="20" height="50" rx="10" fill="#e63946" />
      <rect x="305" y="125" width="20" height="50" rx="10" fill="#e63946" />
    </g>

    <g id="microfono">
      <path d="M 310 160 Q 280 210 220 200" fill="transparent" stroke="#d0d0d0" stroke-width="4" />
      <rect x="195" y="190" width="25" height="12" rx="6" fill="#e63946" />
    </g>

    <rect x="115" y="105" width="170" height="90" rx="45" fill="#1a1a1a" stroke="#333333" stroke-width="4" />

    <g id="expresion-feliz" filter="url(#resplandor)">
      <g id="ojos">
        <path d="M 145 145 Q 160 125 175 145" fill="transparent" stroke="#ff4d4d" stroke-width="7" stroke-linecap="round" />
        <path d="M 225 145 Q 240 125 255 145" fill="transparent" stroke="#ff4d4d" stroke-width="7" stroke-linecap="round" />
      </g>
      
      <g id="boca">
        <path id="boca-trazo" d="M 170 165 Q 200 185 230 165" fill="transparent" stroke="#ff4d4d" stroke-width="7" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
