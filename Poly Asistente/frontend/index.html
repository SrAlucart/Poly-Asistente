<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Bot - Asistente Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ambient-light-1"></div>
    <div class="ambient-light-2"></div>

    <div class="interfaz-contenedor">
        <div class="bot-container" id="polybot-contenedor">
            
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" id="polybot-svg" width="100%" height="100%">
                <defs>
                    <filter id="resplandor-neon" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <linearGradient id="cristal-visor" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#020617" />
                    </linearGradient>
                    <linearGradient id="cuerpo-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#cbd5e1" />
                    </linearGradient>
                </defs>

                <ellipse id="sombra-suelo" cx="200" cy="360" rx="70" ry="10" fill="#000000" opacity="0.3" filter="blur(6px)" />

                <g id="robot-completo">
                    
                    <ellipse cx="200" cy="320" rx="60" ry="15" fill="none" stroke="#e63946" stroke-width="2" opacity="0.5" filter="url(#resplandor-neon)" />

                    <g id="mano-izq">
                        <circle cx="80" cy="230" r="15" fill="#ffffff" filter="url(#resplandor-neon)" />
                        <circle cx="80" cy="230" r="8" fill="#ea0909" />
                    </g>
                    <g id="mano-der">
                        <circle cx="320" cy="230" r="15" fill="#ffffff" filter="url(#resplandor-neon)" />
                        <circle cx="320" cy="230" r="8" fill="#ea0909" />
                    </g>

                    <g id="torso">
                        <path d="M 140 210 Q 200 310 260 210 Z" fill="url(#cuerpo-metal)" />
                        <circle cx="200" cy="245" r="18" fill="#ffffff" />
                        <circle id="pecho-logo" cx="200" cy="245" r="10" fill="#ea0909" filter="url(#resplandor-neon)" />
                    </g>

                    <g id="articulacion-cabeza">
                        <rect x="80" y="70" width="240" height="140" rx="70" fill="url(#cuerpo-metal)" />
                        <rect x="65" y="115" width="15" height="50" rx="7.5" fill="#ff0000" />
                        <rect x="320" y="115" width="15" height="50" rx="7.5" fill="#ff0000" />
                        <rect x="95" y="85" width="210" height="110" rx="55" fill="url(#cristal-visor)" stroke="#334155" stroke-width="3" />
                        <path d="M 110 120 Q 200 85 290 120 A 45 45 0 0 0 110 120 Z" fill="#ffffff" opacity="0.1" />

                        <g id="rostro-luces" filter="url(#resplandor-neon)">
                            <g id="ojos">
                                <path d="M 145 135 Q 160 120 175 135" fill="none" stroke="#ff4d5a" stroke-width="8" stroke-linecap="round" />
                                <path d="M 225 135 Q 240 120 255 135" fill="none" stroke="#ff4d5a" stroke-width="8" stroke-linecap="round" />
                            </g>
                            <g id="boca">
                                <path d="M 175 160 Q 200 180 225 160" fill="none" stroke="#ff4d5a" stroke-width="6" stroke-linecap="round" />
                            </g>
                        </g>
                    </g>
                </g>
            </svg>

        </div>

        <div class="controles">
            <button id="btn-hablar" class="btn-voz">🎙️</button>
            <div id="estado">Sistema en espera...</div>
            <div id="transcripcion">Inicia la comunicación por voz.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
